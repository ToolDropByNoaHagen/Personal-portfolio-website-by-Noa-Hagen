<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 696" width="480" height="696">
  <!-- Hypermoderne cover 480 x 696 -->

  <defs>
    <!-- Donker verloop als basis -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a1b20"/>
      <stop offset="55%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>

    <!-- Zachte lichtgloed diagonaal -->
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Fijn raster -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Radiale gloed achter het label -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f80000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#721104" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Basis -->
  <rect width="480" height="696" fill="url(#bg)"/>
  <rect width="480" height="696" fill="url(#grid)"/>

  <!-- Diagonale lichtstreep -->
  <polygon points="0,696 200,696 480,180 480,20" fill="url(#beam)"/>

  <!-- Dunne accentlijnen boven- en onderaan -->
  <rect x="40" y="70" width="120" height="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="40" y="626" width="60" height="2" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Kleine markeringen (hypermodern / technisch gevoel) -->
  <g fill="#ffffff" fill-opacity="0.35" font-family="monospace" font-size="13">
    <text x="40" y="60">/ 01</text>
    <text x="400" y="60">ARCHIVE</text>
    <text x="40" y="650">TOOLDROP</text>
    <text x="360" y="650">2026</text>
  </g>

  <!-- Radiale gloed achter het midden-label -->
  <ellipse cx="240" cy="348" rx="220" ry="120" fill="url(#glow)"/>

<!-- Hoofdlabel, gecentreerd -->
  <g font-family="'Bungee', sans-serif" font-weight="900">
    <text x="240" y="360" fill="#ffffff" font-size="40" letter-spacing="2" text-anchor="middle">TOOLDROPBY</text>
    <text x="153" y="408" fill="#ffffff" font-size="40" letter-spacing="2" text-anchor="middle">NOA</text>
    <text x="293" y="408" fill="#c71313" font-size="40" letter-spacing="2" text-anchor="middle">HAGEN</text>
  </g>

  <!-- Fijne rand binnenin -->
  <rect x="10" y="10" width="460" height="676" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
