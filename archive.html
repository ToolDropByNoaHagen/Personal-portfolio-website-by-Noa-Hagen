    Where every build has its own story

<!-- ====================================================================
     # HORIZONTALE GALERIJ (boeken)
     Klik op een boek -> foto slidet naar links, uitleg fadet rechts in.

     PER PROJECT INVULLEN in het JSON-blok in elk boek:
       "title"    = kop in het detail
       "body"     = uitgebreide uitleg
       "link"     = website-URL  (LEEG "" = geen knop)
       "linkText" = tekst op de knop
======================================================================= -->
<div class="archive-viewport" id="archiveViewport">
  <section class="archive-grid" id="archiveGrid">

    <!-- PROJECT 1 -->
    <a class="archive-item" href="#" data-name="ToolDropByNoaHagen">
      <div class="archive-thumb"><img src="Assets/project1-cover.svg" alt="ToolDropByNoaHagen"></div>
      <div class="archive-meta"><h2>ToolDropByNoaHagen</h2></div>
      <script type="application/json" class="archive-detail">
        {
          "title": "ToolDropByNoaHagen",
          "body": "A self-built portfolio site, designed and coded entirely by me — from the first sketch to the final line. It brings together the things I make in one place, built with HTML, CSS and JavaScript. Every part, from layout to animation, is my own work. Consider it the first page of something still being written.",
          "link": "https://tooldropbynoahagen.com",
          "linkText": "Visit"
        }
      </script>
    </a>

    <!-- VERBORGEN: PROJECT 2 verwijder deze regel en "einde verborgen" onderaan om ze weer te tonen
    <a class="archive-item" href="#" data-name="Project two">
      <div class="archive-thumb"></div>
      <div class="archive-meta"><h2>Project two</h2></div>
      <script type="application/json" class="archive-detail">
        { "title": "Project two", "body": "Uitleg over project twee.", "link": "", "linkText": "" }
      </script>
    </a> einde verborgen -->

    <!-- VERBORGEN: PROJECT 3 verwijder deze regel en "einde verborgen" onderaan om ze weer te tonen
    <a class="archive-item" href="#" data-name="Project three">
      <div class="archive-thumb"></div>
      <div class="archive-meta"><h2>Project three</h2></div>
      <script type="application/json" class="archive-detail">
        { "title": "Project three", "body": "Uitleg over project drie.", "link": "", "linkText": "" }
      </script>
    </a> einde verborgen -->

  </section>
</div>

<!-- ====================================================================
     # DETAIL-OVERLAY -- foto links, uitleg rechts
     Verschijnt over de galerij bij een klik. JS vult de inhoud.
======================================================================= -->
<div class="detail-overlay" id="detailOverlay" aria-hidden="true">
  <button class="detail-close" id="detailClose" aria-label="Sluiten">&times;</button>
  <div class="detail-stage">
    <!-- Links: de omslagfoto die naar zijn plek slidet -->
    <div class="detail-cover" id="detailCover"></div>
    <!-- Rechts: uitleg + link, fadet in -->
    <div class="detail-info">
      <p class="detail-tag">Project</p>
      <h2 class="detail-title" id="detailTitle"></h2>
      <p class="detail-body" id="detailBody"></p>
      <a class="btn btn-primary detail-link" id="detailLink" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>
